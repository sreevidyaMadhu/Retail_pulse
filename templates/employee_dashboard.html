<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .menu {
            margin-top: 20px;
        }

        .menu a {
            display: block;
            width: 250px;
            padding: 14px;
            margin-bottom: 12px;
            text-decoration: none;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: black;
        }

        .menu a:hover {
            background-color: #f2f2f2;
        }

        .logout {
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>Employee Dashboard</h1>

    <p class="subtitle">
        Welcome, {{ current_user.username }}
    </p>

    <div class="menu">

        <a href="{{ url_for('inventory') }}">
            📦 Inventory
        </a>

        <a href="{{ url_for('sales') }}">
            🛒 Sales
        </a>

        <a href="#">
            🌦️ Weather & Demand
        </a>

    </div>

    <hr>

    <div class="logout">
        <a href="{{ url_for('logout') }}">
            Logout
        </a>
    </div>

</body>
</html>
