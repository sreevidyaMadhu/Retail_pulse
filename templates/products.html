<!DOCTYPE html>
<html>
<head>
    <title>Products - RetailPulse</title>
</head>

<body>

    <h1>RetailPulse</h1>

    <h2>Product Management</h2>

    <p>
        Welcome, {{ current_user.username }}
    </p>

    <a href="{{ url_for('add_product') }}">
        Add Product
    </a>

    <br><br>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
        </tr>

        {% for product in products %}

        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.category }}</td>
            <td>₹{{ product.price }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="{{ url_for('manager_dashboard') }}">
        Back to Dashboard
    </a>

</body>
</html>
