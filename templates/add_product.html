<!DOCTYPE html>
<html>
<head>
    <title>Add Product - RetailPulse</title>
</head>

<body>

    <h1>RetailPulse</h1>

    <h2>Add New Product</h2>

    <form method="POST">

        <h3>Product Details</h3>

        <label>Product Name:</label>
        <br>
        <input type="text" name="name" required>

        <br><br>

        <label>Category:</label>
        <br>
        <input type="text" name="category" required>

        <br><br>

        <label>Price:</label>
        <br>
        <input
            type="number"
            name="price"
            step="0.01"
            min="0"
            required
        >

        <hr>

        <h3>Initial Inventory</h3>

        <label>Quantity:</label>
        <br>
        <input
            type="number"
            name="quantity"
            min="1"
            required
        >

        <br><br>

        <label>Reorder Level:</label>
        <br>
        <input
            type="number"
            name="reorder_level"
            min="0"
            value="10"
            required
        >

        <hr>

        <h3>Initial Batch</h3>

        <label>Batch Number:</label>
        <br>
        <input
            type="text"
            name="batch_number"
            required
        >

        <br><br>

        <label>Manufacture Date:</label>
        <br>
        <input
            type="date"
            name="manufacture_date"
        >

        <br><br>

        <label>Received Date:</label>
        <br>
        <input
            type="date"
            name="received_date"
            required
        >

        <br><br>

        <label>Expiry Date:</label>
        <br>
        <input
            type="date"
            name="expiry_date"
            required
        >

        <br><br>

        <button type="submit">
            Add Product
        </button>

    </form>

    <br>

    <a href="{{ url_for('products') }}">
        Back to Products
    </a>

</body>
</html>
